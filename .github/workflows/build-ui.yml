name: Build & Push — cph/ui

on:
  push:
    branches: [main, master]
    paths:
      - 'ui/**'
  pull_request:
    branches: [main, master]
    paths:
      - 'ui/**'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/${{ github.repository_owner }}/cph-ui
  # Google Artifact Registry (Cloud Run's required image source, D-07) — set the
  # GCP_REGION / GCP_PROJECT_ID / GCP_ARTIFACT_REPO repo variables (Settings → Actions → Variables).
  AR_REGISTRY: ${{ vars.GCP_REGION }}-docker.pkg.dev
  AR_IMAGE: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.GCP_ARTIFACT_REPO }}/cph-ui

jobs:
  build:
    name: Build & Push cph/ui
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # -----------------------------
      # Best-effort GCP authentication
      # -----------------------------
      - name: Authenticate to GCP (Workload Identity Federation)
        id: gcp-auth
        continue-on-error: true
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          token_format: access_token

      - name: Set up gcloud CLI
        if: steps.gcp-auth.outcome == 'success'
        uses: google-github-actions/setup-gcloud@v2

      - name: Log in to Google Artifact Registry
        id: gcp-ar-login
        if: steps.gcp-auth.outcome == 'success'
        continue-on-error: true
        uses: docker/login-action@v3
        with:
          registry: ${{ env.AR_REGISTRY }}
          username: oauth2accesstoken
          password: ${{ steps.gcp-auth.outputs.access_token }}

      # -----------------------------
      # GHCR
      # -----------------------------
      - name: Extract image metadata (GHCR)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-,format=short

      - name: Build and push (GHCR)
        uses: docker/build-push-action@v6
        with:
          context: ui
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=cph-ui
          cache-to: type=gha,mode=max,scope=cph-ui

      # -----------------------------
      # Google Artifact Registry
      # -----------------------------
      - name: Extract image metadata (Artifact Registry)
        id: meta-ar
        if: steps.gcp-ar-login.outcome == 'success'
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.AR_IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-,format=short

      - name: Build and push (Artifact Registry)
        if: steps.gcp-ar-login.outcome == 'success'
        continue-on-error: true
        uses: docker/build-push-action@v6
        with:
          context: ui
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta-ar.outputs.tags }}
          labels: ${{ steps.meta-ar.outputs.labels }}
          cache-from: type=gha,scope=cph-ui
          cache-to: type=gha,mode=max,scope=cph-ui