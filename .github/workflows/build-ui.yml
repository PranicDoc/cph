name: Build & Push — cph/ui

on:
  push:
    branches: [main, master]
    paths:
      - 'ui/**'
  pull_request:
    branches: [main, master]
    paths:
      - 'ui/**'
  workflow_dispatch:

jobs:
  # Shared build: PranicDoc/infra/.github/workflows/build-image.yml
  build:
    name: Build & Push cph/ui
    permissions:
      contents: read
      packages: write
      id-token: write
    uses: PranicDoc/infra/.github/workflows/build-image.yml@main
    with:
      image_name: cph-ui
      context: ui
      build_args: |
        GOOGLE_CLIENT_ID=${{ vars.GOOGLE_CLIENT_ID }}
      # gar_environment: uat       # enable once this repo has a `uat` environment (see infra README)
    secrets: inherit
