name: Deploy branch image to VM

# Manually deploy an arbitrary branch's cph image to the production VM, gated by
# the cph-vm-deploy approval environment. Mechanism: build the branch image
# (tag ghcr.io/<owner>/cph:sha-<short>), snapshot the currently-live
# ghcr.io/<owner>/cph:latest onto :vm-rollback, then retag :latest to the new
# build. The VM's `docker compose pull cph` is unchanged — it just pulls the
# moved :latest. Roll back with the "Roll back cph on VM" workflow.
#
# Requires: GitHub Environment `cph-vm-deploy` (required reviewers); secrets
# VM_HOST / VM_USER / VM_PASSWORD / GPR_KEY, and — for run_backfill —
# APP_BASE_URL / SUPADM_USERNAME / SUPADM_PASSWORD.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch / tag / SHA to build from (blank = the branch selected above)"
        type: string
        default: ""
      image_tag:
        description: "Existing GHCR tag to deploy WITHOUT building, e.g. sha-abc1234 (blank = build)"
        type: string
        default: ""
      run_backfill:
        description: "Run the Practitioner-role backfill after a healthy deploy"
        type: boolean
        default: true
      auto_revert_on_failure:
        description: "If the health check fails, put :latest back to :vm-rollback and redeploy"
        type: boolean
        default: true

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build branch image
    if: ${{ inputs.image_tag == '' }}
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.meta.outputs.version }}
    steps:
      - name: Resolve image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/cph" >> "$GITHUB_ENV"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          # Branch build — sha-<short> only, never :latest.
          tags: type=sha,prefix=sha-,format=short

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: app
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            GPR_USER=${{ github.actor }}
            GPR_KEY=${{ secrets.GPR_KEY }}
          cache-from: type=gha,scope=cph
          cache-to: type=gha,mode=max,scope=cph

  deploy:
    name: Promote & deploy to VM
    needs: [build]
    if: ${{ always() && (needs.build.result == 'success' || needs.build.result == 'skipped') }}
    runs-on: ubuntu-latest
    environment: cph-vm-deploy
    steps:
      - name: Resolve image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/cph" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve target tag
        id: tag
        run: |
          set -euo pipefail
          TAG="${{ inputs.image_tag != '' && inputs.image_tag || needs.build.outputs.image_tag }}"
          if [ -z "$TAG" ]; then
            echo "::error::could not determine an image tag to deploy (build skipped and no image_tag given?)"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "## Deploy \`$IMAGE:$TAG\` to the VM" >> "$GITHUB_STEP_SUMMARY"

      - name: Snapshot current :latest -> :vm-rollback
        run: |
          set -euo pipefail
          docker buildx imagetools create --tag "$IMAGE:vm-rollback" "$IMAGE:latest"
          echo "- snapshotted the current \`:latest\` onto \`:vm-rollback\` (rollback point)" >> "$GITHUB_STEP_SUMMARY"

      - name: Promote target -> :latest
        run: |
          set -euo pipefail
          docker buildx imagetools create --tag "$IMAGE:latest" "$IMAGE:${{ steps.tag.outputs.tag }}"
          DIGEST=$(docker buildx imagetools inspect "$IMAGE:latest" --format '{{.Manifest.Digest}}' 2>/dev/null || true)
          echo "- \`:latest\` now points at \`${{ steps.tag.outputs.tag }}\` (\`$DIGEST\`)" >> "$GITHUB_STEP_SUMMARY"

      - name: Deploy on VM and wait for healthy
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          password: ${{ secrets.VM_PASSWORD }}
          script_stop: true
          script: |
            set -e
            cd /opt/pranicdoc
            docker compose pull cph
            docker compose up -d --no-deps cph
            cid=$(docker compose ps -q cph)
            if [ -z "$cid" ]; then echo "cph container not found after up" >&2; docker compose ps >&2; exit 1; fi
            for i in $(seq 1 30); do
              s=$(docker inspect -f '{{.State.Health.Status}}' "$cid" 2>/dev/null || echo missing)
              echo "health[$i/30]: $s"
              if [ "$s" = healthy ]; then exit 0; fi
              sleep 10
            done
            echo "cph did not become healthy within ~5 min" >&2
            docker compose logs --tail=80 cph >&2 || true
            exit 1

      - name: Revert :latest -> :vm-rollback (deploy failed)
        if: ${{ failure() && inputs.auto_revert_on_failure }}
        run: |
          set -euo pipefail
          echo "::warning::deploy failed — reverting :latest to :vm-rollback"
          docker buildx imagetools create --tag "$IMAGE:latest" "$IMAGE:vm-rollback"
          echo "- deploy failed; reverted \`:latest\` to \`:vm-rollback\` and redeploying" >> "$GITHUB_STEP_SUMMARY"

      - name: Redeploy previous image on VM (deploy failed)
        if: ${{ failure() && inputs.auto_revert_on_failure }}
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          password: ${{ secrets.VM_PASSWORD }}
          script_stop: true
          script: |
            set -e
            cd /opt/pranicdoc
            docker compose pull cph
            docker compose up -d --no-deps cph
            cid=$(docker compose ps -q cph)
            if [ -z "$cid" ]; then echo "cph container not found after up" >&2; docker compose ps >&2; exit 1; fi
            for i in $(seq 1 30); do
              s=$(docker inspect -f '{{.State.Health.Status}}' "$cid" 2>/dev/null || echo missing)
              echo "health[$i/30]: $s"
              if [ "$s" = healthy ]; then exit 0; fi
              sleep 10
            done
            echo "cph did not become healthy within ~5 min after revert" >&2
            docker compose logs --tail=80 cph >&2 || true
            exit 1

  backfill:
    name: Practitioner-role backfill
    needs: [deploy]
    if: ${{ needs.deploy.result == 'success' && inputs.run_backfill }}
    uses: ./.github/workflows/backfill-practitioner-role.yml
    secrets: inherit
