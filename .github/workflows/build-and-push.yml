name: Build & Push — cph

on:
  push:
    branches: [main, master]
    paths:
      - 'app/**'           # only rebuild when the Spring Boot app changes, not ui/
  # No pull_request trigger — build & push only runs automatically on a real
  # push/merge to main. PR authors who need to test a build run this workflow
  # manually (Actions tab -> this workflow -> Run workflow, choosing their PR
  # branch) via the workflow_dispatch trigger below.
  workflow_dispatch:

jobs:
  # Shared build: PranicDoc/infra/.github/workflows/build-image.yml
  build:
    name: Build & Push cph
    permissions:
      contents: read
      packages: write
      id-token: write
    uses: PranicDoc/infra/.github/workflows/build-image.yml@main
    with:
      image_name: cph
      context: app                 # Dockerfile lives in cph/app/
      use_gpr_key: true            # common-dtos / storageService come from GitHub Packages
      # gar_environment: uat       # enable once this repo has a `uat` environment (see infra README)
    secrets: inherit

  # Shared VM deploy: PranicDoc/infra/.github/workflows/deploy-vm.yml — waits for an approval
  # comment on the issue it opens, then Ansible pulls, restarts and health-checks the service.
  # Only a real push/merge to main deploys; a manual run only builds (to test a PR's image).
  deploy:
    name: Deploy cph on VM
    needs: build
    if: github.event_name == 'push'
    permissions:
      contents: read
      issues: write              # approval gate
    uses: PranicDoc/infra/.github/workflows/deploy-vm.yml@main
    with:
      services: cph
      image_tag: ${{ needs.build.outputs.image_tag }}
    secrets: inherit             # VM_HOST, VM_USER, VM_PASSWORD (or VM_SSH_KEY)
