name: Build & Push — cph

on:
  push:
    branches: [main, master]
    paths:
      - 'app/**'           # only rebuild when the Spring Boot app changes, not ui/
  # No pull_request trigger — build & push only runs automatically on a real
  # push/merge to main. PR authors who need to test a build run this workflow
  # manually (Actions tab -> this workflow -> Run workflow, choosing their PR
  # branch) via the workflow_dispatch trigger below.
  workflow_dispatch:

jobs:
  # Shared build: PranicDoc/infra/.github/workflows/build-image.yml
  build:
    name: Build & Push cph
    permissions:
      contents: read
      packages: write
      id-token: write
    uses: PranicDoc/infra/.github/workflows/build-image.yml@main
    with:
      image_name: cph
      context: app                 # Dockerfile lives in cph/app/
      use_gpr_key: true            # common-dtos / storageService come from GitHub Packages
      # gar_environment: uat       # enable once this repo has a `uat` environment (see infra README)
    secrets: inherit

  # ── Optional: auto-deploy to VM after a successful push ────────────────────
  # Requires three repo secrets:
  #   VM_HOST      — Contabo VM IP or hostname
  #   VM_USER      — SSH user (e.g. root)
  #   VM_PASSWORD  — SSH password
  deploy:
    name: Deploy cph on VM
    runs-on: ubuntu-latest
    needs: build
    # Only a real push/merge to main queues a deploy — a manual workflow_dispatch
    # run (used to build & push a test image for a PR, see `on:` above) never
    # triggers one, so testing a PR build can't accidentally roll out to the VM.
    if: github.event_name == 'push'
    # Requires a GitHub Environment named `cph-vm-deploy` with "Required reviewers"
    # set to just the repo owner (Settings -> Environments -> cph-vm-deploy) —
    # that setting can't be expressed in YAML, it must be configured in the
    # GitHub UI/API. Until that environment exists, this job will fail to start
    # rather than silently skip the approval gate.
    environment: cph-vm-deploy

    steps:
      - name: Redeploy cph only
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          password: ${{ secrets.VM_PASSWORD }}
          script: |
            cd /opt/pranicdoc
            docker compose pull cph
            docker compose up -d --no-deps cph
            docker image prune -f
