name: Build & Push — cph

on:
  push:
    branches: [main, master]
    paths:
      - 'app/**'           # only rebuild when the Spring Boot app changes, not ui/
  # No pull_request trigger — build & push only runs automatically on a real
  # push/merge to main. PR authors who need to test a build run this workflow
  # manually (Actions tab -> this workflow -> Run workflow, choosing their PR
  # branch) via the workflow_dispatch trigger below.
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/${{ github.repository_owner }}/cph
  # Google Artifact Registry (Cloud Run's required image source, D-07) — set the
  # GCP_REGION / GCP_PROJECT_ID / GCP_ARTIFACT_REPO repo variables (Settings → Actions → Variables).
  AR_REGISTRY: ${{ vars.GCP_REGION }}-docker.pkg.dev
  AR_IMAGE: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.GCP_ARTIFACT_REPO }}/cph

jobs:
  build:
    name: Build & Push cph
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write   # required for GCP Workload Identity Federation (google-github-actions/auth)

    outputs:
      image-tag: ${{ steps.meta.outputs.version }}   # used by deploy job

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # GCP push is best-effort for now (no GCP account/secrets provisioned yet) — GHCR push
      # and deploy must not block on it. Flip back to a hard failure once GCP_* secrets/vars
      # are provisioned by removing the `continue-on-error: true` lines below.
      - name: Authenticate to GCP (Workload Identity Federation)
        id: gcp-auth
        continue-on-error: true
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          token_format: 'access_token'

      - name: Set up gcloud CLI
        if: steps.gcp-auth.outcome == 'success'
        uses: google-github-actions/setup-gcloud@v2

      - name: Log in to Google Artifact Registry
        id: gcp-ar-login
        if: steps.gcp-auth.outcome == 'success'
        continue-on-error: true
        uses: docker/login-action@v3
        with:
          registry: ${{ env.AR_REGISTRY }}
          username: oauth2accesstoken
          password: ${{ steps.gcp-auth.outputs.access_token }}

      - name: Extract image metadata (GHCR)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-,format=short

      - name: Build and push (GHCR)
        uses: docker/build-push-action@v6
        with:
          context: app                 # Dockerfile lives in cph/app/
          # Always push: this workflow only ever runs on a real push to main
          # or a manual workflow_dispatch run (see `on:` above) — never on a
          # pull_request event — so there's no case where a build shouldn't push.
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            GPR_USER=${{ github.actor }}
            GPR_KEY=${{ secrets.GPR_KEY }}
          cache-from: type=gha,scope=cph
          cache-to: type=gha,mode=max,scope=cph

      - name: Extract image metadata (Artifact Registry)
        id: meta-ar
        if: steps.gcp-ar-login.outcome == 'success'
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.AR_IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-,format=short

      - name: Build and push (Artifact Registry)
        if: steps.gcp-ar-login.outcome == 'success'
        continue-on-error: true
        uses: docker/build-push-action@v6
        with:
          context: app
          push: true
          tags: ${{ steps.meta-ar.outputs.tags }}
          labels: ${{ steps.meta-ar.outputs.labels }}
          build-args: |
            GPR_USER=${{ github.actor }}
            GPR_KEY=${{ secrets.GPR_KEY }}
          cache-from: type=gha,scope=cph
          cache-to: type=gha,mode=max,scope=cph

  # ── Optional: auto-deploy to VM after a successful push ────────────────────
  # Requires three repo secrets:
  #   VM_HOST     — Contabo VM IP or hostname
  #   VM_USER     — SSH user (e.g. root)
  #   VM_SSH_KEY  — private SSH key whose public key is in ~/.ssh/authorized_keys on the VM
  deploy:
    name: Deploy cph on VM
    runs-on: ubuntu-latest
    needs: build
    # Only a real push/merge to main queues a deploy — a manual workflow_dispatch
    # run (used to build & push a test image for a PR, see `on:` above) never
    # triggers one, so testing a PR build can't accidentally roll out to the VM.
    if: github.event_name == 'push'
    # Requires a GitHub Environment named `cph-vm-deploy` with "Required reviewers"
    # set to just the repo owner (Settings -> Environments -> cph-vm-deploy) —
    # that setting can't be expressed in YAML, it must be configured in the
    # GitHub UI/API. Until that environment exists, this job will fail to start
    # rather than silently skip the approval gate.
    environment: cph-vm-deploy

    steps:
      - name: Redeploy cph only
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          password: ${{ secrets.VM_PASSWORD }}
          script: |
            cd /opt/pranicdoc
            docker compose pull cph
            docker compose up -d --no-deps cph
            docker image prune -f

  # ── Required post-deploy step: baseline "Practitioner" role backfill ───────
  # Runs AFTER the app is live (so Flyway V33–V36 have created the rbac_*
  # tables and BaselineRoleSeeder has created the role) and BEFORE the release
  # is considered done — if it fails, this run goes red. It reconciles the
  # role's grant matrix to app/src/main/resources/rbac/baseline-role.json and
  # assigns the role to every pre-existing healer that has none.
  #
  # Also runnable on its own from the Actions tab (workflow_dispatch) whenever
  # the grant matrix changes. Needs DB_HOST / DB_PORT / DB_NAME / DB_USERNAME /
  # DB_PASSWORD secrets — see backfill-practitioner-role.yml.
  backfill-practitioner-role:
    name: Backfill Practitioner role
    needs: deploy
    if: github.event_name == 'push'
    uses: ./.github/workflows/backfill-practitioner-role.yml
    secrets: inherit
