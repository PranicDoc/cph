name: Roll back cph on VM

# Put the VM back on the image that was running before the last
# "Deploy branch image to VM" run (the ghcr.io/<owner>/cph:vm-rollback pointer),
# or an explicit tag. Retags :latest to that image and redeploys via the VM's
# unchanged `docker compose pull cph`. Gated by the cph-vm-deploy approval
# environment; the run summary shows the exact target before you approve.
#
# :vm-rollback is NOT modified here, so repeated rollbacks are idempotent. To
# move forward again, run "Deploy branch image to VM" (or merge to main).
#
# Requires: GitHub Environment `cph-vm-deploy`; secrets VM_HOST / VM_USER /
# VM_PASSWORD.

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "GHCR tag to roll back to (blank = :vm-rollback, the image from before the last branch deploy)"
        type: string
        default: ""

permissions:
  contents: read
  packages: write

jobs:
  rollback:
    name: Promote rollback image & deploy
    runs-on: ubuntu-latest
    environment: cph-vm-deploy
    steps:
      - name: Resolve image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/cph" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve & inspect rollback target
        id: src
        run: |
          set -euo pipefail
          SRC="${{ inputs.image_tag != '' && inputs.image_tag || 'vm-rollback' }}"
          echo "src=$SRC" >> "$GITHUB_OUTPUT"

          if ! docker buildx imagetools inspect "$IMAGE:$SRC" > /tmp/inspect.txt 2>&1; then
            echo "::error::No image at $IMAGE:$SRC — run 'Deploy branch image to VM' at least once to record a rollback point, or pass image_tag."
            cat /tmp/inspect.txt
            exit 1
          fi

          {
            echo "## Rolling cph back to \`$IMAGE:$SRC\`"
            echo
            echo '### Manifest'
            echo '```'
            cat /tmp/inspect.txt
            echo '```'
            echo '<details><summary>Image config (labels / revision / created)</summary>'
            echo
            echo '```json'
            docker buildx imagetools inspect "$IMAGE:$SRC" --format '{{ json .Image }}' 2>/dev/null || echo '{}'
            echo '```'
            echo '</details>'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Promote rollback target -> :latest
        run: |
          set -euo pipefail
          docker buildx imagetools create --tag "$IMAGE:latest" "$IMAGE:${{ steps.src.outputs.src }}"
          DIGEST=$(docker buildx imagetools inspect "$IMAGE:latest" --format '{{.Manifest.Digest}}' 2>/dev/null || true)
          echo "- \`:latest\` now points at \`${{ steps.src.outputs.src }}\` (\`$DIGEST\`)" >> "$GITHUB_STEP_SUMMARY"

      - name: Deploy on VM and wait for healthy
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          password: ${{ secrets.VM_PASSWORD }}
          script_stop: true
          script: |
            set -e
            cd /opt/pranicdoc
            docker compose pull cph
            docker compose up -d --no-deps cph
            cid=$(docker compose ps -q cph)
            if [ -z "$cid" ]; then echo "cph container not found after up" >&2; docker compose ps >&2; exit 1; fi
            for i in $(seq 1 30); do
              s=$(docker inspect -f '{{.State.Health.Status}}' "$cid" 2>/dev/null || echo missing)
              echo "health[$i/30]: $s"
              [ "$s" = healthy ] && exit 0
              sleep 10
            done
            echo "cph did not become healthy within ~5 min after rollback" >&2
            docker compose logs --tail=80 cph >&2 || true
            exit 1
