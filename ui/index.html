<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HealingARK</title>
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <script>
      /* Apply the view and saved theme before first paint (no flash). Mirrors
         ui-version/storage.ts: the new view unless the build sets the kill switch. */
      (function () {
        try {
          var root = document.documentElement;
          if ("%VITE_NEW_VIEW%" !== "off") {
            var theme = localStorage.getItem("hl.ui.theme");
            if (theme !== "light" && theme !== "system") theme = "dark";
            if (theme === "system") theme = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
            root.dataset.ui = "new";
            root.dataset.theme = theme;
          } else {
            root.dataset.ui = "classic";
          }
        } catch (e) {}
      })();
    </script>
    <script src="https://accounts.google.com/gsi/client" async></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
