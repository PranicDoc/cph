<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Registration: personal details (light)</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="../hl.css"><style>body{margin:0}</style></head><body>
<div class="hl light" style="min-height: 1250px; --mh: 900px">
<div class="ground"></div>
<header class="mhead glass"><div class="brand-mark"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4.5 18a7.5 7.5 0 0115 0"/><path d="M12 6.5v3.5"/></svg></div><span class="title">New patient</span><button class="icon-btn" type="button" aria-label="Switch theme"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4"/></svg></button><div class="avatar">AR</div></header>
<div class="shell" style="min-height: 1250px">
<aside class="side glass">
<div class="brand"><div class="brand-mark"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4.5 18a7.5 7.5 0 0115 0"/><path d="M12 6.5v3.5"/></svg></div><span class="brand-name">HealingARK</span></div>
<a class="nav" href="#"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 11l8-7 8 7v8a1 1 0 01-1 1h-4v-6H9v6H5a1 1 0 01-1-1v-8z"/></svg>Dashboard</a>
<a class="nav on" href="#"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M16 19v-1.5a3.5 3.5 0 00-3.5-3.5h-5A3.5 3.5 0 004 17.5V19"/><circle cx="10" cy="8" r="3.5"/><path d="M20 19v-1.5a3.5 3.5 0 00-2.5-3.35M15.5 4.6a3.5 3.5 0 010 6.8"/></svg>Patients</a>
<a class="nav" href="#"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M14 3H7a2 2 0 00-2 2v14a2 2 0 002 2h10a2 2 0 002-2V8l-5-5z"/><path d="M14 3v5h5"/></svg>PDFs</a>

<div class="side-foot"><div class="avatar">AR</div><div style="min-width: 0"><div style="font-weight: 600; font-size: 13.5px">Dr. Asha Rao</div><div class="small muted">Healer</div></div></div>
</aside>
<main class="main">
<div class="topbar glass"><span class="crumb">Patients</span><svg class="ico" viewBox="0 0 24 24" aria-hidden="true" style="color: var(--muted); width: 14px"><path d="M9 6l6 6-6 6"/></svg><span style="font-weight: 600">New patient</span><div class="search"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4-4"/></svg> Search or jump to<kbd>Ctrl K</kbd></div><button class="icon-btn" type="button" aria-label="Switch theme"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4"/></svg></button></div>
<div class="page-head"><div><h1>New patient registration</h1><p class="muted" style="margin-top: 6px">Step 1 of 4: personal details.</p></div></div><div class="surface" style="padding:16px 22px"><div style="display:flex;align-items:center;justify-content:space-between;gap:12px"><div style="font-weight:600">Step 1 of 4</div><div class="small muted">Personal details</div></div><div style="display:flex;gap:8px;margin-top:10px"><span style="flex:1;height:6px;border-radius:99px;background:var(--primary)"></span><span style="flex:1;height:6px;border-radius:99px;background:var(--hair-strong)"></span><span style="flex:1;height:6px;border-radius:99px;background:var(--hair-strong)"></span><span style="flex:1;height:6px;border-radius:99px;background:var(--hair-strong)"></span></div></div><div class="surface form-card" style="max-width: none; gap: 22px"><div class="row2"><div><label class="lbl" for="f15">First name</label><input id="f15" class="input" type="text" value="Sunita"></div><div><label class="lbl" for="f16">Last name</label><input id="f16" class="input" type="text" value="Patel"></div></div><div class="row2"><div><label class="lbl" for="f17">Date of birth</label><input id="f17" class="input" type="text" value="12 Mar 1984"></div><div><label class="lbl" for="f18">Gender</label><div class="input select" role="img" aria-label="Gender: Female"><span>Female</span><svg class="ico" viewBox="0 0 24 24" aria-hidden="true" style="color: var(--muted)"><path d="M6 9l6 6 6-6"/></svg></div></div></div><div class="row2"><div><label class="lbl" for="f19">Marital status</label><div class="input select" role="img" aria-label="Marital status: Married"><span>Married</span><svg class="ico" viewBox="0 0 24 24" aria-hidden="true" style="color: var(--muted)"><path d="M6 9l6 6 6-6"/></svg></div></div><div><label class="lbl" for="f20">Occupation</label><input id="f20" class="input" type="text" value="Teacher"></div></div><div class="row2"><div><label class="lbl" for="f21">WhatsApp / phone</label><input id="f21" class="input" type="text" value="+91 98200 11122"><div class="help">Used for session reminders.</div></div><div><label class="lbl" for="f22">Email</label><input id="f22" class="input" type="text" value="sunita.patel@example.com"></div></div><div><label class="lbl" for="f23">Address line 1</label><input id="f23" class="input" type="text" value="14 Lake View Road"></div><div><label class="lbl" for="f24">Address line 2</label><input id="f24" class="input" type="text" value="Near the community hall"></div><div class="row3"><div><label class="lbl" for="f25">City</label><input id="f25" class="input" type="text" value="Pune"></div><div><label class="lbl" for="f26">State</label><input id="f26" class="input" type="text" value="Maharashtra"></div><div><label class="lbl" for="f27">ZIP code</label><input id="f27" class="input" type="text" value="411001"></div></div><div style="display:flex;justify-content:flex-end;gap:10px;padding-top:18px;border-top:1px solid var(--hair)"><button class="btn btn-primary" type="button">Next</button></div></div>
</main>
</div>
