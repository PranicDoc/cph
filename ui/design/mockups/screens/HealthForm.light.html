<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Patient: health details (light)</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="../hl.css"><style>body{margin:0}</style></head><body>
<div class="hl light" style="min-height: 1500px">
<div class="ground"></div>
<header class="pubhead glass"><div class="brand-mark"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4.5 18a7.5 7.5 0 0115 0"/><path d="M12 6.5v3.5"/></svg></div><span class="brand-name">HealingARK</span></header>
<main class="pubmain" style="max-width: 760px"><div class="page-head"><div><h1>Your health details</h1><p class="muted" style="margin-top: 6px">Your healer will review these before the session.</p></div></div><div class="surface form-card" style="max-width:none;gap:22px"><div><label class="lbl" for="f36">Chief complaint *</label><textarea id="f36" class="input area" rows="3">Recurring headaches and low energy since August.</textarea></div><div><label class="lbl">Symptoms</label><div class="input" style="height: auto; min-height: 44px; padding: 6px 8px; display: flex; gap: 8px; flex-wrap: wrap; align-items: center"><span class="chip on">Headache<svg class="ico" style="width:13px;height:13px;transform:rotate(45deg)" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></span><span class="chip on">Fatigue<svg class="ico" style="width:13px;height:13px;transform:rotate(45deg)" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></span><span class="chip on">Insomnia<svg class="ico" style="width:13px;height:13px;transform:rotate(45deg)" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></span><span class="chip on">Acidity<svg class="ico" style="width:13px;height:13px;transform:rotate(45deg)" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></span><span class="muted" style="padding: 0 6px">Add symptom</span></div></div><div><div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:4px"><label class="lbl" style="margin:0">Medications</label><button class="btn btn-ghost" type="button"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>Add medicine</button></div><div class="medrow"><input class="input" type="text" value="Telmisartan"><input class="input" type="text" value="40 mg"><div style="display:flex;gap:14px"><div style="display: flex; align-items: center; gap: 10px"><div class="chk on"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></div><span>Morning</span></div><div style="display: flex; align-items: center; gap: 10px"><div class="chk"></div><span>Afternoon</span></div><div style="display: flex; align-items: center; gap: 10px"><div class="chk"></div><span>Night</span></div></div><button class="icon-btn danger" type="button" aria-label="Remove"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 7h14M10 7V4h4v3M7 7l1 13h8l1-13M10 11v6M14 11v6"/></svg></button></div></div><div><label class="lbl">Lab findings</label><div class="dropzone" style="padding:18px"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true" style="width:22px;height:22px"><path d="M12 16V5M7.5 9L12 4.5 16.5 9M5 20h14"/></svg><div style="margin-top:6px;color:var(--text);font-weight:550">Drop lab reports or browse</div><div class="small">PDF or image, up to 10 MB each</div></div></div><div><label class="lbl" for="f37">Complementary modalities (treatments other than main doctor consulting)</label><textarea id="f37" class="input area" rows="3"></textarea></div><div><label class="lbl" for="f38">Infectious illness</label><textarea id="f38" class="input area" rows="3"></textarea></div><div style="display:flex;justify-content:flex-end;padding-top:18px;border-top:1px solid var(--hair)"><button class="btn btn-primary" type="button">Submit my details</button></div></div></main>
</div>
</body></html>
