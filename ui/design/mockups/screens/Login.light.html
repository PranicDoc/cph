<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Healer / Sign in (light)</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="../hl.css"><style>body{margin:0}</style></head><body>
<div class="hl is-login light" style="min-height: 900px">
<div class="ground"></div>
<section class="surface center-card" aria-label="Sign in" style="border-radius: 24px; box-shadow: var(--shadow-sheet)">
  <div class="brand" style="padding: 0 0 22px"><div class="brand-mark"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4.5 18a7.5 7.5 0 0115 0"/><path d="M12 6.5v3.5"/></svg></div><span class="brand-name">HealingARK</span></div>
  <h2 style="font-size: 22px">Welcome back</h2>
  <p class="muted" style="margin: 6px 0 22px">Sign in to your healing practice.</p>
  <div class="stack" style="gap: 18px">
    <div><label class="lbl" for="f7">Email</label><input id="f7" class="input" type="text" value="asha.rao@example.com"></div><div><label class="lbl" for="f8">Password</label><input id="f8" class="input" type="text" value="&bull;&bull;&bull;&bull;&bull;&bull;&bull;&bull;&bull;&bull;"></div>
    <button class="btn btn-primary" type="button" style="width: 100%; height: 44px">Sign in</button>
    <div style="display: flex; align-items: center; gap: 12px; color: var(--muted); font-size: 12.5px"><span style="flex: 1; height: 1px; background: var(--hair)"></span>or<span style="flex: 1; height: 1px; background: var(--hair)"></span></div>
    <button class="btn btn-secondary" type="button" style="width: 100%; height: 44px">Continue with Google</button>
  </div>
  <p class="small muted" style="text-align: center; margin-top: 20px">New healer? <span style="color: var(--accent-text); font-weight: 600">Create an account</span></p>
</section>
</div>
</body></html>
