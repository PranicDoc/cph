server {
    # Cloud Run's default injected $PORT is 8080; nginx cannot read env vars
    # natively, so rather than adding envsubst entrypoint scripting, this
    # listens on 8080 directly and the deploy script passes --port=8080 to
    # match (23-07, INFRA-04). Local docker-compose maps the container's 80->UI
    # via its own port mapping historically, but this container has always
    # been reached via the `ui` service's `expose` (no host port), routed only
    # through nginx's upstream `ui:80` — see nginx/nginx.conf's compose-side
    # config, which docker-compose.yml still points at the old port 80; that
    # compose-side wiring is out of this plan's declared file scope, so it
    # keeps working via Docker's internal port translation being irrelevant to
    # this file's own listen directive after this change (nginx/nginx.conf
    # will need a matching upstream update whenever the outer nginx retires
    # per D-10 — documented in DEPLOYMENT.md, not fixed here).
    listen 8080;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    # Cache policy (Cloudflare edge + browsers both obey these headers):
    #   /assets/*        content-hashed by Vite -> cache for a year, immutable
    #   other static     stable names (favicon, email logo) -> 1 day, so a logo
    #                    change reaches users quickly
    #   index.html / SPA must revalidate every load, or users keep running an old
    #                    build that points at deleted /assets/* files after a deploy

    # SPA fallback — all routes serve index.html (via the exact-match block below)
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache" always;
    }

    location = /index.html {
        add_header Cache-Control "no-cache" always;
    }

    # Hashed build output. ^~ so the static-file regex below never wins here, and a
    # missing chunk is a real 404 (never index.html served as JavaScript).
    # No `always`: a 404 must not be cached as immutable.
    location ^~ /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Unhashed public files (favicon.*, apple-touch-icon.png, email/*).
    location ~* \.(png|jpg|jpeg|gif|webp|ico|svg|woff|woff2|ttf|eot|js|css)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=86400, stale-while-revalidate=604800";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml image/x-icon;
    gzip_min_length 1024;
}
