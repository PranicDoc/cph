server {
    # Cloud Run's default injected $PORT is 8080; nginx cannot read env vars
    # natively, so rather than adding envsubst entrypoint scripting, this
    # listens on 8080 directly and the deploy script passes --port=8080 to
    # match (23-07, INFRA-04). Local docker-compose maps the container's 80->UI
    # via its own port mapping historically, but this container has always
    # been reached via the `ui` service's `expose` (no host port), routed only
    # through nginx's upstream `ui:80` — see nginx/nginx.conf's compose-side
    # config, which docker-compose.yml still points at the old port 80; that
    # compose-side wiring is out of this plan's declared file scope, so it
    # keeps working via Docker's internal port translation being irrelevant to
    # this file's own listen directive after this change (nginx/nginx.conf
    # will need a matching upstream update whenever the outer nginx retires
    # per D-10 — documented in DEPLOYMENT.md, not fixed here).
    listen 8080;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback — all routes serve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Static assets — aggressive caching
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
