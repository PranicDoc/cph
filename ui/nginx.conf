# Upstream backends — Docker DNS resolves service names
upstream cph_backend {
    server cph:9918;
    keepalive 4;
}

upstream creditservice_backend {
    server creditservice:9112;
    keepalive 2;
}

upstream pdfworker_backend {
    server pdfworker:8080;
    keepalive 2;
}

server {
    listen 80;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    # ── API proxy ──────────────────────────────────────────────────────────────

    location /cph/ {
        proxy_pass         http://cph_backend;
        proxy_http_version 1.1;
        proxy_set_header   Connection        "";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_connect_timeout 5s;
        proxy_read_timeout    30s;
    }

    location /credits/ {
        proxy_pass         http://creditservice_backend;
        proxy_http_version 1.1;
        proxy_set_header   Connection        "";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_connect_timeout 5s;
        proxy_read_timeout    30s;
    }

    # ── Static assets — long cache ─────────────────────────────────────────────

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # ── SPA fallback ───────────────────────────────────────────────────────────

    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── Compression ────────────────────────────────────────────────────────────

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
