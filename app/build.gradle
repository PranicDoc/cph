plugins {
	id 'java'
	id 'org.springframework.boot' version '3.3.5'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.pranicdoc'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(17)
	}
}

repositories {
	mavenCentral()

	maven {
		url = uri("https://maven.pkg.github.com/PranicDoc/storage-sdk")

		credentials {
			username = project.findProperty("gpr.user")
			password = project.findProperty("gpr.key")
		}
	}

	maven {
		url = uri("https://maven.pkg.github.com/PranicDoc/common-dtos")

		credentials {
			username = project.findProperty("gpr.user")
			password = project.findProperty("gpr.key")
		}
	}
}

dependencies {
	// --- Spring Boot starters ---
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-mail'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-web'

	// --- Hibernate Envers (audit history) ---
	implementation 'org.hibernate.orm:hibernate-envers'

	// --- JWT ---
	implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
	runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'
	runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.6'

	// --- MapStruct (compile-time DTO mapping) ---
	implementation 'org.mapstruct:mapstruct:1.6.3'
	annotationProcessor 'org.mapstruct:mapstruct-processor:1.6.3'

	// --- UUIDv7 ---
	implementation 'com.github.f4b6a3:uuid-creator:6.0.0'

	implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310'

	// --- OpenAPI / Swagger ---
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.5.0'

	// --- Database ---
	runtimeOnly 'org.postgresql:postgresql'
	runtimeOnly 'com.mysql:mysql-connector-j'

	// --- Flyway ---
	implementation 'org.flywaydb:flyway-core'
	runtimeOnly 'org.flywaydb:flyway-database-postgresql'

	// --- Observability ---
	runtimeOnly 'io.micrometer:micrometer-registry-prometheus'

	// --- Lombok ---
	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'
	// Lombok + MapStruct binding (ensures Lombok runs before MapStruct)
	annotationProcessor 'org.projectlombok:lombok-mapstruct-binding:0.2.0'

	// --- Kafka ---
	implementation 'org.springframework.kafka:spring-kafka'

	// --- Redis ---
	implementation 'org.springframework.boot:spring-boot-starter-data-redis'

	// --- Dev tools ---
	developmentOnly 'org.springframework.boot:spring-boot-devtools'

	// --- Test ---
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.springframework.security:spring-security-test'
	testCompileOnly 'org.projectlombok:lombok'
	testAnnotationProcessor 'org.projectlombok:lombok'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testRuntimeOnly 'com.h2database:h2'
	testImplementation 'org.wiremock:wiremock-standalone:3.9.1'

	// --- Resilience4j ---
	implementation 'io.github.resilience4j:resilience4j-spring-boot3:2.4.0'

	// --- Caffeine ---
	implementation 'com.github.ben-manes.caffeine:caffeine'

	// --- Storage Service ---
	implementation 'com.pranicdoc:storage-sdk:1.0.1'

	// --- Common DTOs ---
	implementation 'com.pranicdoc:common-dtos:0.1.2'

	// --- Lib Phone Number ---
	implementation 'com.googlecode.libphonenumber:libphonenumber:8.13.31'

	// --- Oauth2 ---
	implementation 'org.springframework.boot:spring-boot-starter-oauth2-client'
}

tasks.named('test') {
	useJUnitPlatform()
}

configurations.all {
	resolutionStrategy.cacheChangingModulesFor 0, 'seconds'
}
