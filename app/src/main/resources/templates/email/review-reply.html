<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>New reply on a case review</title>
</head>
<body style="margin:0;padding:0;background-color:#F5F3FA;">
<div th:replace="~{fragments :: preheader(${preheader})}"></div>
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color:#F5F3FA;">
  <tr>
    <td align="center" style="padding:24px 12px;">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0"
             style="max-width:600px;background-color:#FFFFFF;border-radius:20px;">
        <tr><td><table th:replace="~{fragments :: header}"></table></td></tr>
        <tr>
          <td style="padding:16px 40px 32px 40px;font-family:Arial,Helvetica,sans-serif;color:#1F1A2E;font-size:16px;line-height:24px;">
            <h1 style="margin:0 0 16px 0;font-size:24px;line-height:32px;font-weight:bold;" th:text="${heading}">New reply on a case review</h1>
            <p style="margin:0 0 12px 0;" th:text="'Hello ' + ${toName} + ','">Hello,</p>
            <p style="margin:0 0 12px 0;" th:text="${message}">There is a new reply.</p>
            <table th:replace="~{fragments :: button(${link}, 'Open the conversation')}"></table>
            <p th:replace="~{fragments :: fallbackLink(${link})}"></p>
            <p style="margin:24px 0 0 0;">With care,<br>Team HealingARK</p>
          </td>
        </tr>
        <tr><td><table th:replace="~{fragments :: footer}"></table></td></tr>
      </table>
    </td>
  </tr>
</table>
</body>
</html>
