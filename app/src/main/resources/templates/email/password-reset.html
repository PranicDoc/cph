<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>Reset your password</title>
</head>
<body style="margin:0;padding:0;background-color:#F5F3FA;">
<div th:replace="~{fragments :: preheader('Choose a new password for your HealingARK account.')}"></div>
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color:#F5F3FA;">
  <tr>
    <td align="center" style="padding:24px 12px;">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0"
             style="max-width:600px;background-color:#FFFFFF;border-radius:20px;">
        <tr><td><table th:replace="~{fragments :: header}"></table></td></tr>
        <tr>
          <td style="padding:16px 40px 32px 40px;font-family:Arial,Helvetica,sans-serif;color:#1F1A2E;">
            <h1 style="margin:0 0 16px 0;font-size:24px;line-height:32px;font-weight:bold;">Reset your password</h1>
            <p style="margin:0;font-size:16px;line-height:24px;">
              We received a request to reset the password of your HealingARK account.
              Choose a new one with the button below.
            </p>
            <table th:replace="~{fragments :: button(${link}, 'Choose a new password')}"></table>
            <p style="margin:8px 0 0 0;font-size:14px;line-height:22px;color:#6B6480;">
              <span th:text="|This link expires in ${expiryMinutes} minutes and can be used once.|">This link expires in 30 minutes and can be used once.</span>
              If you didn't ask for this, you can ignore this email - your password stays as it is.</p>
            <p th:replace="~{fragments :: fallbackLink(${link})}"></p>
          </td>
        </tr>
        <tr><td><table th:replace="~{fragments :: footer}"></table></td></tr>
      </table>
    </td>
  </tr>
</table>
</body>
</html>
