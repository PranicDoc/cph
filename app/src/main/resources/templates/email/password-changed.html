<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>Your password was changed</title>
</head>
<body style="margin:0;padding:0;background-color:#F5F3FA;">
<div th:replace="~{fragments :: preheader('Your HealingARK password was just changed.')}"></div>
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color:#F5F3FA;">
  <tr>
    <td align="center" style="padding:24px 12px;">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0"
             style="max-width:600px;background-color:#FFFFFF;border-radius:20px;">
        <tr><td><table th:replace="~{fragments :: header}"></table></td></tr>
        <tr>
          <td style="padding:16px 40px 32px 40px;font-family:Arial,Helvetica,sans-serif;color:#1F1A2E;">
            <h1 style="margin:0 0 16px 0;font-size:24px;line-height:32px;font-weight:bold;">Your password was changed</h1>
            <p style="margin:0 0 12px 0;font-size:16px;line-height:24px;">
              The password of your HealingARK account was just changed. If this was you, there is nothing more to do.
            </p>
            <p style="margin:0;font-size:16px;line-height:24px;">
              If it wasn't you, choose <strong>Forgot password?</strong> on the sign-in page to reset it right away,
              and reply to this email so we can help.
            </p>
            <table th:replace="~{fragments :: button(${link}, 'Go to sign in')}"></table>
          </td>
        </tr>
        <tr><td><table th:replace="~{fragments :: footer}"></table></td></tr>
      </table>
    </td>
  </tr>
</table>
</body>
</html>
