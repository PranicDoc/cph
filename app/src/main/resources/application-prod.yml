spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/pranic_doc
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      # D-18: was 5 — exhausted at 10 concurrent users (Gatling
      # AdminScenarioSimulation baseline 2026-07-07: 11/16 pass, 5 KO all
      # "found 502" — pool exhaustion). Raised to 15; stay well under
      # Aiven's plan-tier max_connections ceiling (shared across every cph
      # instance + pdfWorker + creditService connecting to the same
      # Aiven-managed Postgres) — re-check the ceiling before raising
      # further or before adding more concurrently-deployed instances.
      maximum-pool-size: 15
      minimum-idle: 1
      connection-timeout: 30000
      idle-timeout: 30000
      max-lifetime: 1800000

  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope: [openid, email, profile]

app:
  base:
    url: ${APP_BASE_URL}
  jwt:
    secret: ${JWT_SECRET}
  encryption:
    key: ${ENCRYPTION_KEY}
  cookies:
    secure: true
    same-site: None
  feedback:
    url: ${APP_FEEDBACK_URL}
  invite:
    url: ${APP_INVITE_URL}

storage:
  endpoint: ${R2_ENDPOINT}
  access-key: ${R2_ACCESS_KEY}
  secret-key: ${R2_SECRET_KEY}

credit-service:
  base-url: ${CREDIT_SERVICE_URL:http://creditservice:9112}
  api-key: ${CREDIT_API_KEY}
