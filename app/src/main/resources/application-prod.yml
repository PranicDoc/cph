spring:
  datasource:
    # Routed through PgBouncer (transaction-pool mode), not directly at Postgres —
    # pranic_doc's Aiven tier has max_connections=20, ~10 of which are fixed Aiven
    # overhead (background workers/HA), leaving too little for direct per-connection
    # Hikari pools across cph + pdfWorker. prepareThreshold=0 disables server-side
    # prepared-statement caching, which doesn't survive PgBouncer's transaction-mode
    # connection multiplexing. reWriteBatchedInserts=true lets the driver send a Hibernate
    # JDBC insert batch (spring.jpa.properties.hibernate.jdbc.batch_size) as multi-row INSERTs,
    # i.e. one network round trip per batch instead of one per row.
    url: jdbc:postgresql://${PGBOUNCER_HOST}:${PGBOUNCER_PORT:6432}/pranic_doc?prepareThreshold=0&reWriteBatchedInserts=true
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      # Trimmed from 15 (D-18) to fit the real budget once PgBouncer absorbs burst
      # concurrency — 15 direct connections alone could exceed the ~10-connection
      # budget left after Aiven's fixed overhead.
      maximum-pool-size: 6
      minimum-idle: 1
      connection-timeout: 30000
      idle-timeout: 30000
      max-lifetime: 1800000

  # Flyway bypasses PgBouncer — migrations use session-level advisory locks that
  # don't survive transaction-mode connection multiplexing. Direct connection only.
  flyway:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/pranic_doc
    user: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope: [openid, email, profile]

app:
  base:
    url: ${APP_BASE_URL}
  jwt:
    secret: ${JWT_SECRET}
  encryption:
    key: ${ENCRYPTION_KEY}
  cookies:
    secure: true
    same-site: None
  feedback:
    url: ${APP_FEEDBACK_URL}
  invite:
    url: ${APP_INVITE_URL}

storage:
  endpoint: ${R2_ENDPOINT}
  access-key: ${R2_ACCESS_KEY}
  secret-key: ${R2_SECRET_KEY}

credit-service:
  base-url: ${CREDIT_SERVICE_URL:http://creditservice:9112}
  api-key: ${CREDIT_API_KEY}
