spring:
  application:
    name: cph
  datasource:
    url: jdbc:postgresql://localhost:5432/pranic_doc
    username: postgres
    password: root123
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update

  #  Remove later for prod after enabling kafka
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.kafka.KafkaAutoConfiguration

  kafka:
    bootstrap-servers: localhost:9092

    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      retries: 5
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5
      batch-size: 16384
      linger-ms: 5
      compression-type: snappy

    template:
      default-topic: pdf-jobs

app:
  jwt:
    # Base64-encoded 64-byte secret for HS512 — CHANGE THIS IN PRODUCTION
    secret: Y2hhbmdlLXRoaXMtdG8tYS1sb25nLXNlY3JldC1rZXktaW4tcHJvZHVjdGlvbi1lbnZpcm9ubWVudC1wbGVhc2U=
    access-token-expiration-ms: 3600000     # 1 hour
    refresh-token-expiration-ms: 604800000  # 7 days
  encryption:
    # Base64-encoded 32-byte AES key — CHANGE THIS IN PRODUCTION
    key: MTIzNDU2Nzg5MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTI=
  cookies:
    secure: true    # true in production (HTTPS only)
    same-site: None   # "None" for cross-origin, "Strict" for same-site only
  enable:
    kafka: false
  feedback:
    url: https://localhost:3000/feedback
    token-expiry-hours: 48

storage:
  provider: R2
  bucket: pranicdoc-pdfs
  endpoint: ${R2_ENDPOINT}
  access-key: ${R2_ACCESS_KEY}
  secret-key: ${R2_SECRET_KEY}
  presigned-expiry-minutes: 10

server:
  port: 9918
  servlet:
    context-path: /cph

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true

creditservice:
  base-url: http://localhost:8081
  api-key: ${CREDIT_API_KEY:changeme-dev-only}

resilience4j:
  circuitbreaker:
    instances:
      creditService:
        registerHealthIndicator: true
        slidingWindowSize: 10
        slidingWindowType: COUNT_BASED
        minimumNumberOfCalls: 5
        failureRateThreshold: 50
        waitDurationInOpenState: 30s
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true
        ignoreExceptions:
          - com.pranicdoc.cph.common.exception.InsufficientCreditsException
