spring:
  application:
    name: cph

  # Kafka producer disabled until Kafka is deployed — remove this exclude when ready
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.kafka.KafkaAutoConfiguration

  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      retries: 5
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5
      batch-size: 16384
      linger-ms: 5
      compression-type: snappy
    template:
      default-topic: pdf-jobs

  jpa:
    hibernate:
      ddl-auto: none

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 9918
  servlet:
    context-path: /cph

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  health:
    redis:
      enabled: false

app:
  jwt:
    access-token-expiration-ms: 3600000
    refresh-token-expiration-ms: 604800000
  enable:
    kafka: false
  feedback:
    token-expiry-hours: 48
  whatsapp:
    phone-number-id: ${WHATSAPP_PHONE_NUMBER_ID:placeholder-phone-number-id}
    access-token: ${WHATSAPP_ACCESS_TOKEN:placeholder-access-token}
    webhook-verify-token: ${WHATSAPP_WEBHOOK_VERIFY_TOKEN:placeholder-verify-token}
    app-secret: ${WHATSAPP_APP_SECRET:placeholder-app-secret}

storage:
  provider: R2
  bucket: pranicdoc-pdfs
  presigned-expiry-minutes: 10

dashboard:
  cache:
    ttl-minutes: 5

resilience4j:
  circuitbreaker:
    instances:
      creditService:
        registerHealthIndicator: true
        slidingWindowSize: 10
        slidingWindowType: COUNT_BASED
        minimumNumberOfCalls: 5
        failureRateThreshold: 50
        waitDurationInOpenState: 30s
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true
        ignoreExceptions:
          - com.pranicdoc.cph.common.exception.InsufficientCreditsException
