spring:
  application:
    name: cph

  # Kafka producer disabled until Kafka is deployed — remove this exclude when ready
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.kafka.KafkaAutoConfiguration

  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      retries: 5
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5
      batch-size: 16384
      linger-ms: 5
      compression-type: snappy
    template:
      default-topic: pdf-jobs

  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        # D-19: exposes SessionFactory.getStatistics().getPrepareStatementCount()
        # so SqlCountAssertionTest can assert a bounded SQL statement count per
        # request (permanent regression guard against N+1 reintroduction).
        generate_statistics: true
        # D-25: default global fix for N+1 across per-entity lazy collection
        # loads — Hibernate batches up to 50 uninitialized collections of the
        # same role into a single "WHERE id IN (...)" query instead of firing
        # one query per parent entity/collection.
        default_batch_fetch_size: 50

  flyway:
    enabled: true
    locations: classpath:db/migration

  # Explicit bounded SMTP timeouts (Pitfall 3 mitigation) — a slow/misconfigured
  # SMTP server must never hang the invite-creation HTTP request indefinitely.
  mail:
    properties:
      mail:
        smtp:
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

  # This backend serves no static content (the SPA is hosted separately on
  # Cloudflare Pages, per PROJECT.md) — disable Spring Boot's default static
  # resource handler so genuinely unmapped paths (e.g. the deleted /register
  # endpoint, D-10) return a real 404 instead of silently falling through to
  # ResourceHttpRequestHandler's empty 200 response.
  web:
    resources:
      add-mappings: false

  mvc:
    # Route unmapped paths through DispatcherServlet's NoHandlerFoundException
    # (caught by GlobalExceptionHandler) instead of the servlet container's
    # default 404 page, so unmapped-path responses stay in the same RFC 7807
    # ProblemDetail shape as every other error in this API.
    throw-exception-if-no-handler-found: true

server:
  port: 9918
  servlet:
    context-path: /cph

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  metrics:
    tags:
      application: cph
    distribution:
      percentiles-histogram:
        http.server.requests: true
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  health:
    redis:
      enabled: false

app:
  jwt:
    access-token-expiration-ms: 3600000
    refresh-token-expiration-ms: 604800000
  enable:
    kafka: false
  feedback:
    token-expiry-hours: 48
  invite:
    token-expiry-hours: 72
  whatsapp:
    phone-number-id: ${WHATSAPP_PHONE_NUMBER_ID:placeholder-phone-number-id}
    access-token: ${WHATSAPP_ACCESS_TOKEN:placeholder-access-token}
    webhook-verify-token: ${WHATSAPP_WEBHOOK_VERIFY_TOKEN:placeholder-verify-token}
    app-secret: ${WHATSAPP_APP_SECRET:placeholder-app-secret}

storage:
  provider: R2
  bucket: pranicdoc-pdfs
  presigned-expiry-minutes: 10

dashboard:
  cache:
    ttl-minutes: 5

resilience4j:
  circuitbreaker:
    instances:
      creditService:
        registerHealthIndicator: true
        slidingWindowSize: 10
        slidingWindowType: COUNT_BASED
        minimumNumberOfCalls: 5
        failureRateThreshold: 50
        waitDurationInOpenState: 30s
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true
        ignoreExceptions:
          - com.pranicdoc.cph.common.exception.InsufficientCreditsException
